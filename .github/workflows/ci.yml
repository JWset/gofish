name: Go
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: go run ./examples/tiny
      - run: go run ./examples/xor
      - run: go run ./examples/transformer
      - run: go run ./examples/gguf
